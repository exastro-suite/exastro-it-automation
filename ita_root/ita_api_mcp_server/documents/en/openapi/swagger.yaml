    get:
      tags:
      - Menu Excel
      description: |
        Get Excel for new registration<br>
        Note: There are two types of file format specification for download.
      operationId: get_excel_format
      parameters:
      - name: organization_id
        in: path
        description: OrganizationID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: path
        description: WorkspaceID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: menu
        in: path
        description: Menu name
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: file
        in: query
        description: Specify the file format for downloading
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          example1:
            summary: Binary format (recommended)
            value: '.../format/?file=binary'
          example2:
            summary: Base64 string format (deprecated since 2.5.0)
            value: '.../format/'
      responses:
        "200":
          description: |
            Success <br>
            Note: If the query parameter file=binary is included, the file will be returned in binary format.<br>
            Note: The file name refers to the "filename" included in the HTTP header "Content-Disposition".
          content:
            application/octet-stream:
              example: Binary data
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_8"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ERROR_TEMPLATE"
        "500":
