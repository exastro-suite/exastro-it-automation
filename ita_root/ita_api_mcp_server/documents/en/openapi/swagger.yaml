            description: Column group ID
          column_group_name:
            type: string
            description: Column group name
          column_type:
            type: integer
            description: Column type
          column_disp_seq:
            type: integer
            description: Display order
          description:
            type: string
            description: Item description
          ref_table_name:
            type: string
            description: ID linkage table name
          ref_pkey_name:
            type: string
            description: ID linkage table PK
          ref_col_name:
            type: string
            description: ID linkage item name
          ref_sort_conditions:
            type: string
            description: ID linkage sort condition
          ref_multi_lang:
            type: string
            description: Whether ID linkage supports multiple languages
