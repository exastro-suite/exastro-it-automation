- name: Menu MaintenanceAll
  description: Bulk record operations (register/update/abolish/restore/physical
    delete)
- name: Menu Excel
  description: Get and operate Excel
- name: User Info
  description: Get user information
- name: System Info
  description: Get ITA information
- name: Menu Create
  description: Parameter sheet creation function
- name: Conductor Controll
  description: Get and operate Conductor information
- name: Driver Controll
  description: Get and operate Driver information
- name: Export Import
  description: Export and import data
- name: Compare Controll
  description: Get and operate comparison information
- name: Terraform Cloud EP
  description: Integration with Terraform Cloud/Enterprise
- name: CI/CD for IaC
  description: CI/CD for IaC operations
- name: OASE
  description: For OASE
- name: Apply
  description: Apply parameters
- name: InternalHealthCheckService
  description: Health check operations (internal use)
