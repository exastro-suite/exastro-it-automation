  /api/{organization_id}/workspaces/{workspace_id}/ita/menu/{menu}/maintenance/all/:
    post:
      tags:
      - Menu MaintenanceAll
      description: Bulk register/update/abolish/restore/physically delete records
      operationId: maintenance_all
      parameters:
      - name: organization_id
        in: path
        description: OrganizationID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workspace_id
        in: path
        description: WorkspaceID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: menu
        in: path
        description: |
          Menu name

          (Examples)

          * Standard menu:
            * `operation_list` : Operation list
          * Parameter sheet, data sheet:
            * `rest_name` : the registered rest name
          * Job management:
            * `execution_list_ansible_legacy` : ansible legacy execution history / execution list
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
